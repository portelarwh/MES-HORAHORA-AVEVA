name: Verificação

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxe, referências, ids e handlers
        run: npm run check
      - name: Testes automatizados
        run: npm test
      - name: Build do arquivo único
        run: npm run build
      - name: O dist commitado está atualizado
        run: git diff --exit-code -- dist/ || (echo "Rode 'npm run build' e commite o dist." && exit 1)
